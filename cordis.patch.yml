# dsh-note-wall bundle layer: the row loads this package's main entry as the
# Host half (profile-wide JSON note store + same-origin API). The `dsh.client`
# declaration in package.json makes the Web app load ./client.js as the browser
# half (left-rail entry + note wall page).
- insert:
    - id: note-wall
      name: 'dsh-note-wall'
      config: {}
